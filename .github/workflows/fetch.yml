name: fetch-ww1-assets
on:
  push:
    branches: [ww1-assets]
    paths: [urls.txt]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download public-domain images from Wikimedia Commons
        run: |
          mkdir -p img
          while read -r key url; do
            [ -z "$key" ] && continue
            [ -f "img/$key.jpg" ] && continue
            for i in 1 2 3 4 5; do
              code=$(curl -sS -L -o tmp.bin -w '%{http_code}|%header{retry-after}' -A 'PUWHistoryVideoAssets/1.0 (https://github.com/samandar3104-prog/Yordamchi-AI) curl/8' "$url")
              [ "${code%%|*}" = "200" ] && break
              echo "retry $key $code" | tee -a fetch.log; sleep 20
            done
            if [ "${code%%|*}" = "200" ]; then convert tmp.bin[0] -resize '2400x2400>' -quality 90 "img/$key.jpg" && echo "ok $key" | tee -a fetch.log; else echo "FAIL $key" | tee -a fetch.log; fi
            sleep 2
          done < urls.txt
          rm -f tmp.bin
      - name: Commit
        run: |
          git config user.name "asset-bot"
          git config user.email "asset-bot@users.noreply.github.com"
          touch fetch.log; git add -A .
          git commit -m "Add archival images" || true
          git push
