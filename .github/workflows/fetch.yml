name: fetch-ww1-assets
on:
  push:
    branches: [ww1-assets]
    paths: [urls.txt]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download public-domain images from Wikimedia Commons
        run: |
          set +e
          pip install -q pillow
          mkdir -p img
          while read -r key url; do
            case "$key" in ""|"#"*) continue;; esac
            [ -f "img/$key.jpg" ] && continue
            for i in 1 2 3 4 5; do
              code=$(curl -sS -L -o tmp.bin -w '%{http_code}|%header{retry-after}' -A 'PUWHistoryVideoAssets/1.0 (https://github.com/samandar3104-prog/Yordamchi-AI) curl/8' "$url")
              [ "${code%%|*}" = "200" ] && break
              echo "retry $key $code" | tee -a fetch.log; sleep 20
            done
            if [ "${code%%|*}" = "200" ]; then python3 -c "import sys;from PIL import Image;Image.MAX_IMAGE_PIXELS=None;im=Image.open('tmp.bin');im.seek(0);im=im.convert('RGB');im.thumbnail((2400,2400));im.save(sys.argv[1],quality=90)" "img/$key.jpg" && echo "ok $key" | tee -a fetch.log || echo "CONVFAIL $key" | tee -a fetch.log; else echo "FAIL $key" | tee -a fetch.log; fi
            sleep 2
          done < urls.txt
          rm -f tmp.bin
      - name: Commit
        if: always()
        run: |
          git config user.name "asset-bot"
          git config user.email "asset-bot@users.noreply.github.com"
          touch fetch.log; git add -A .
          git commit -m "Add archival images" || true
          git push
