name: fetch-ww1-assets
on:
  push:
    branches: [ww1-assets]
    paths: [urls.txt]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download public-domain images from Wikimedia Commons
        run: |
          mkdir -p img
          while read -r key url; do
            [ -z "$key" ] && continue
            [ -f "img/$key.jpg" ] && continue
            for i in 1 2 3 4 5; do
              code=$(curl -sS -L -o tmp.bin -w '%{http_code}' -A 'PUWHistoryVideo/1.0 (https://www.youtube.com/@pastuncovereedworld)' "$url")
              [ "$code" = "200" ] && break
              echo "retry $key $code"; sleep 20
            done
            if [ "$code" = "200" ]; then convert tmp.bin[0] -resize '2400x2400>' -quality 90 "img/$key.jpg" && echo "ok $key"; else echo "FAIL $key"; fi
            sleep 2
          done < urls.txt
          rm -f tmp.bin
      - name: Commit
        run: |
          git config user.name "asset-bot"
          git config user.email "asset-bot@users.noreply.github.com"
          git add img
          git commit -m "Add archival images" || true
          git push
