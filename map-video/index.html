<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; width: 1080px; height: 1920px; overflow: hidden; background: #f3f0e9; font-family: "Inter", "DejaVu Sans", sans-serif; }
  #c { position: absolute; inset: 0; }
  #overlay { position: absolute; inset: 0; pointer-events: none; }
  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 60%, rgba(40,30,20,.28) 100%); }
  .botfade { position: absolute; left: 0; right: 0; bottom: 0; height: 620px; background: linear-gradient(rgba(16,20,32,0), rgba(16,20,32,.82) 62%); }

  .label { position: absolute; left: 0; top: 0; transform-origin: 50% 100%; white-space: nowrap; will-change: transform; }
  .card { display: flex; align-items: center; gap: 18px; background: #1b2233; color: #fff; padding: 18px 30px 18px 22px; border-radius: 22px; font-weight: 700; font-size: 40px; box-shadow: 0 14px 34px rgba(20,15,10,.35); }
  .card .dot { width: 22px; height: 22px; border-radius: 50%; background: #ffb547; box-shadow: 0 0 0 7px rgba(255,181,71,.3); flex: none; }
  .card .sub { display: block; font-size: 25px; font-weight: 500; color: #b9c2d6; margin-top: 2px; }
  .card.center { background: #e5383b; font-size: 54px; padding: 24px 40px 24px 28px; border-radius: 28px; }
  .card.center .dot { background: #fff; box-shadow: 0 0 0 9px rgba(255,255,255,.3); width: 28px; height: 28px; }
  .card.center .sub { color: #ffe0e1; font-size: 30px; }
  .tail { width: 0; height: 0; margin: 0 auto; border-left: 16px solid transparent; border-right: 16px solid transparent; border-top: 18px solid #1b2233; }
  .tail.center { border-top-color: #e5383b; }

  .district { position: absolute; left: 0; top: 0; text-align: center; font-weight: 900; font-size: 60px; letter-spacing: 2px; text-transform: uppercase; white-space: nowrap; color: #fff; padding: 16px 34px; border-radius: 20px; box-shadow: 0 14px 34px rgba(20,15,10,.3); }
  .district small { display: block; font-size: 26px; letter-spacing: 8px; font-weight: 700; opacity: .8; margin-top: 4px; }

  #title { position: absolute; top: 140px; left: 0; right: 0; text-align: center; color: #1b2233; }
  #title .city { font-size: 100px; font-weight: 900; letter-spacing: 18px; }
  #title .sub { font-size: 32px; font-weight: 700; letter-spacing: 10px; color: #e5383b; margin-top: 6px; }

  #chip { position: absolute; top: 110px; left: 60px; display: flex; align-items: center; gap: 14px; background: rgba(27,34,51,.9); color: #fff; padding: 14px 26px; border-radius: 40px; font-size: 30px; font-weight: 600; letter-spacing: 1px; }
  #chip i { width: 14px; height: 14px; border-radius: 50%; background: #e5383b; display: block; }

  #caption { position: absolute; left: 70px; right: 70px; bottom: 200px; text-align: center; font-size: 56px; line-height: 1.28; font-weight: 800; color: rgba(255,255,255,.38); }
  #caption span.on { color: #ffffff; }
  #caption span.key.on { color: #ffb547; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="overlay">
  <div class="vignette"></div>
  <div class="botfade"></div>
  <div id="labels"></div>
  <div id="title"><div class="city">ТАШКЕНТ</div><div class="sub">TOSHKENT SHAHRI</div></div>
  <div id="chip"><i></i>Ташкент · Учтепа</div>
  <div id="caption"></div>
</div>

<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';

const W = 1080, H = 1920;
const GEO = await (await fetch('geo.json')).json();
const MW = GEO.w, MH = GEO.h;               // map units = reference-image pixels (~130 m)
const P = (x, y) => new THREE.Vector2(x - MW / 2, y - MH / 2);   // map px -> world (x, z)
const v3 = (p, y = 0) => new THREE.Vector3(p.x, y, p.y);

// Places in reference-map pixel coordinates (approximate)
const PLACES = {
  city:      P(262, 165),
  uchtepa:   P(176, 168),
  chilonzor: P(214, 208),
  farhad:    P(201, 189),
  vatan:     P(190, 200),
  algoritm:  P(170, 197),
  zangiota:  P(146, 276),
  center:    P(183, 179),
};

// ---------- helpers ----------
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const smooth = (x) => { x = clamp(x, 0, 1); return x * x * x * (x * (x * 6 - 15) + 10); };
const ramp = (t, a, d) => smooth((t - a) / d);
const lerp = (a, b, k) => a + (b - a) * k;
const easeOutBack = (x) => { x = clamp(x, 0, 1); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };

function ribbon(pts, width, y) {
  const pos = [], idx = [];
  for (let i = 0; i < pts.length; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
    const d = b.clone().sub(a).normalize();
    const n = new THREE.Vector2(-d.y, d.x).multiplyScalar(width / 2);
    pos.push(pts[i].x + n.x, y, pts[i].y + n.y, pts[i].x - n.x, y, pts[i].y - n.y);
    if (i < pts.length - 1) { const k = i * 2; idx.push(k, k + 1, k + 2, k + 1, k + 3, k + 2); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  return g;
}
const densify = (pts, step = 0.8) => {
  const out = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1], n = Math.max(1, Math.ceil(a.distanceTo(b) / step));
    for (let k = 0; k < n; k++) out.push(a.clone().lerp(b, k / n));
  }
  out.push(pts[pts.length - 1].clone());
  return out;
};

// ---------- renderer ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#f1eee6');
scene.fog = new THREE.Fog('#f1eee6', 700, 1700);
const camera = new THREE.PerspectiveCamera(40, W / H, 1, 5000);
scene.add(new THREE.HemisphereLight('#ffffff', '#b8a998', 1.6));
const sun = new THREE.DirectionalLight('#fff3e0', 1.4);
sun.position.set(-200, 400, 260);
scene.add(sun);

// ground + basemap
const tex = await new THREE.TextureLoader().loadAsync('basemap.jpg');
tex.colorSpace = THREE.SRGBColorSpace;
tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
tex.generateMipmaps = true; tex.minFilter = THREE.LinearMipmapLinearFilter;
const ground = new THREE.Mesh(new THREE.PlaneGeometry(6000, 6000), new THREE.MeshBasicMaterial({ color: '#f1eee6' }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.2;
scene.add(ground);
const map = new THREE.Mesh(new THREE.PlaneGeometry(MW, MH), new THREE.MeshBasicMaterial({ map: tex }));
map.rotation.x = -Math.PI / 2;
scene.add(map);

// extruded districts
function district(key, color, depth) {
  const pts = GEO.districts[key].map(([x, y]) => P(x, y));
  const shape = new THREE.Shape(pts.map(p => new THREE.Vector2(p.x, -p.y)));
  const geo = new THREE.ExtrudeGeometry(shape, { depth, bevelEnabled: false, curveSegments: 1 });
  const top = new THREE.MeshStandardMaterial({ color, transparent: true, opacity: 0.55, roughness: 0.7, depthWrite: false });
  const side = new THREE.MeshStandardMaterial({ color: new THREE.Color(color).multiplyScalar(0.7), transparent: true, opacity: 0.85, roughness: 0.7 });
  const mesh = new THREE.Mesh(geo, [top, side]);
  mesh.rotation.x = -Math.PI / 2;
  const loop = densify([...pts, pts[0]], 0.6);
  const edge = new THREE.Mesh(ribbon(loop, 1.1, 0), new THREE.MeshBasicMaterial({ color: new THREE.Color(color).multiplyScalar(0.75), transparent: true }));
  const groundGlow = new THREE.Mesh(ribbon(loop, 4, 0.05), new THREE.MeshBasicMaterial({ color, transparent: true, depthWrite: false }));
  scene.add(mesh, edge, groundGlow);
  return {
    set(h, lift) {
      const vis = h > 0.002;
      mesh.visible = edge.visible = groundGlow.visible = vis;
      mesh.scale.z = Math.max(0.001, lift);
      top.opacity = 0.62 * h; side.opacity = 0.9 * h;
      edge.position.y = depth * Math.max(0.001, lift) + 0.05;
      edge.material.opacity = h;
      groundGlow.material.opacity = 0.35 * h;
    },
  };
}
const dUch = district('uchtepa', '#3d7bff', 4);
const dChi = district('chilonzor', '#12b886', 4);
const dZan = district('zangiota', '#8b5cf6', 3);

// pins
const labelsEl = document.getElementById('labels');
function makePin(key, title, sub, color, big = false) {
  const g = new THREE.Group();
  const s = big ? 1.6 : 1;
  const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.28 * s, 0.28 * s, 1, 12).translate(0, 0.5, 0), new THREE.MeshStandardMaterial({ color: '#2a3145' }));
  const head = new THREE.Mesh(new THREE.SphereGeometry(1.3 * s, 28, 18), new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.25, roughness: 0.4 }));
  const ringMat = new THREE.MeshBasicMaterial({ color, transparent: true, side: THREE.DoubleSide, depthWrite: false });
  const ring = new THREE.Mesh(new THREE.RingGeometry(1.0, 1.5, 48).rotateX(-Math.PI / 2), ringMat);
  const ring2 = new THREE.Mesh(ring.geometry, ringMat.clone());
  const disc = new THREE.Mesh(new THREE.CircleGeometry(1.6 * s, 40).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.75, depthWrite: false }));
  ring.position.y = ring2.position.y = 0.3; disc.position.y = 0.25;
  g.add(beam, head, ring, ring2, disc);
  g.position.copy(v3(PLACES[key]));
  scene.add(g);
  const el = document.createElement('div');
  el.className = 'label';
  el.innerHTML = `<div class="card ${big ? 'center' : ''}"><span class="dot"></span><span>${title}${sub ? `<span class="sub">${sub}</span>` : ''}</span></div><div class="tail ${big ? 'center' : ''}"></div>`;
  labelsEl.appendChild(el);
  return { g, beam, head, ring, ring2, disc, el, s, big, h: big ? 13 : 9 };
}
const pins = {
  farhad:   makePin('farhad', 'Фархадский рынок', 'Farhod bozori', '#ff9f1c'),
  vatan:    makePin('vatan', 'Кинотеатр «Ватан»', 'Vatan kinoteatri', '#ff9f1c'),
  algoritm: makePin('algoritm', 'Алгоритм', 'Algoritm', '#ff9f1c'),
  center:   makePin('center', 'НАШ ЦЕНТР', 'Bizning markaz', '#e5383b', true),
};
const PIN_T = { farhad: 2.7, vatan: 3.88, algoritm: 5.04, center: 7.2 };

function districtLabel(name, sub, bg) {
  const el = document.createElement('div'); el.className = 'district';
  el.style.background = bg;
  el.innerHTML = `${name}<small>${sub}</small>`;
  labelsEl.appendChild(el);
  return el;
}
const dLabels = {
  uchtepa:   districtLabel('Учтепинский район', 'UCHTEPA TUMANI', '#3d7bff'),
  chilonzor: districtLabel('Чиланзар', 'CHILONZOR', '#12b886'),
  zangiota:  districtLabel('Зангиатинский район', 'ZANGIOTA TUMANI', '#8b5cf6'),
};

// arcs from center
const arcs = ['farhad', 'vatan', 'algoritm', 'chilonzor', 'zangiota', 'uchtepa'].map((k, i) => {
  const a = v3(PLACES.center, 0.6), b = v3(PLACES[k], 0.6);
  const mid = a.clone().lerp(b, 0.5); mid.y = 5 + a.distanceTo(b) * 0.3;
  const curve = new THREE.QuadraticBezierCurve3(a, mid, b);
  const seg = 80, rad = 8;
  const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, seg, 0.35, rad, false), new THREE.MeshBasicMaterial({ color: '#e5383b', transparent: true }));
  mesh.frustumCulled = false;
  scene.add(mesh);
  return { mesh, seg, rad, delay: i * 0.08 };
});

// ---------- captions ----------
const WORDS = [["Если",0.12],["вы",0.32],["живёте",0.46],["в",0.9],["Учтепинском",0.96,1],["районе:",1.54,1],
  ["Чиланзар,",2.1,1],["Фархадский",2.7,1],["рынок,",3.24,1],["кинотеатр",3.88,1],["Ватан,",4.48,1],["Алгоритм,",5.04,1],
  ["Зангиатинский",5.9,1],["район",6.68,1],["для",7.24],["вас",7.42],["близко,",7.66],
  ["то",8.1],["наш",8.24,1],["центр",8.48,1],["—",8.6],["именно",8.84],["то,",9.14],["что",9.3],["вы",9.5],["ищете",9.72]];
const CHUNKS = [[0, 6], [6, 12], [12, 17], [17, 26]];
const CHUNK_T = [0, 2.05, 5.85, 8.05];
const capEl = document.getElementById('caption');
const capSpans = CHUNKS.map(([a, b]) => WORDS.slice(a, b).map(w => { const s = document.createElement('span'); s.textContent = w[0] + ' '; if (w[2]) s.className = 'key'; return s; }));

// ---------- camera ----------
const T = (k) => PLACES[k];
// t, target x, target z, distance, polar(deg from vertical), azimuth(deg)
const KF = [
  [0.0,  T('city').x, T('city').y, 900, 18, -8],
  [0.7,  T('city').x - 10, T('city').y, 780, 24, -6],
  [1.6,  T('uchtepa').x, T('uchtepa').y + 6, 300, 40, -10],
  [2.5,  T('chilonzor').x - 4, T('chilonzor').y - 6, 270, 44, -4],
  [3.1,  T('farhad').x, T('farhad').y, 175, 48, 6],
  [4.3,  T('vatan').x, T('vatan').y, 175, 50, 14],
  [5.45, T('algoritm').x, T('algoritm').y, 175, 50, 22],
  [6.6,  T('zangiota').x + 14, T('zangiota').y - 30, 420, 34, 10],
  [7.75, T('center').x + 6, T('center').y + 22, 300, 42, 2],
  [8.7,  T('center').x, T('center').y, 165, 50, -12],
  [10.5, T('center').x, T('center').y, 135, 54, -32],
];
function camAt(t) {
  let i = 0; while (i < KF.length - 2 && t > KF[i + 1][0]) i++;
  const a = KF[i], b = KF[i + 1];
  const k = smooth((t - a[0]) / (b[0] - a[0]));
  const tx = lerp(a[1], b[1], k), tz = lerp(a[2], b[2], k);
  const dist = Math.exp(lerp(Math.log(a[3]), Math.log(b[3]), k));
  const pol = THREE.MathUtils.degToRad(lerp(a[4], b[4], k));
  const az = THREE.MathUtils.degToRad(lerp(a[5], b[5], k) + t * 1.5);
  camera.position.set(tx + dist * Math.sin(pol) * Math.sin(az), dist * Math.cos(pol), tz + dist * Math.sin(pol) * Math.cos(az));
  camera.lookAt(tx, 4, tz);
  camera.updateMatrixWorld();
  return dist;
}

const tmp = new THREE.Vector3();
function project(p3) {
  tmp.copy(p3).project(camera);
  return { x: (tmp.x * 0.5 + 0.5) * W, y: (-tmp.y * 0.5 + 0.5) * H, vis: tmp.z < 1 };
}
const titleEl = document.getElementById('title'), chipEl = document.getElementById('chip');

window.renderAt = function (t) {
  const dist = camAt(t);

  const hU = ramp(t, 0.9, 0.5) * (1 - 0.5 * ramp(t, 2.1, 0.4)) + 0.3 * ramp(t, 8.0, 0.6);
  const hC = ramp(t, 2.05, 0.4) * (1 - 0.55 * ramp(t, 2.8, 0.5));
  const hZ = ramp(t, 5.85, 0.4) * (1 - 0.5 * ramp(t, 7.3, 0.5));
  dUch.set(Math.min(1, hU), easeOutBack((t - 0.9) / 0.7) * (1 - 0.6 * ramp(t, 2.1, 0.5)));
  dChi.set(hC, easeOutBack((t - 2.05) / 0.6) * (1 - 0.6 * ramp(t, 2.8, 0.5)));
  dZan.set(hZ, easeOutBack((t - 5.85) / 0.6) * (1 - 0.6 * ramp(t, 7.3, 0.5)));

  const labelScale = clamp(190 / dist, 0.5, 1.05);
  for (const [k, p] of Object.entries(pins)) {
    const a = t - PIN_T[k];
    const pop = easeOutBack(a / 0.55), grow = smooth(a / 0.5);
    p.g.visible = a > 0;
    if (a <= 0) { p.el.style.opacity = 0; continue; }
    p.beam.scale.set(1, p.h * grow, 1);
    p.head.position.y = p.h * grow;
    p.head.scale.setScalar(Math.max(0.001, pop));
    [p.ring, p.ring2].forEach((r, j) => { const f = (a * 0.9 + j * 0.5) % 1; r.scale.setScalar((1 + f * 4) * p.s); r.material.opacity = 0.85 * (1 - f) * grow; });
    p.disc.scale.setScalar(Math.max(0.001, pop));
    const sp = project(new THREE.Vector3(p.g.position.x, p.h + 1.8 * p.s, p.g.position.z));
    let sc = (p.big ? clamp(150 / dist, 0.6, 1.15) : labelScale) * pop;
    if (p.big) sc *= 1 + 0.12 * ramp(t, 8.1, 0.4);
    const far = p.big ? 1 : 1 - ramp(dist, 330, 90);
    let op = sp.vis ? clamp(a / 0.25, 0, 1) * far : 0;
    if (!p.big && t > 8.1) op *= 1 - 0.75 * ramp(t, 8.2, 0.5);
    p.el.style.opacity = op;
    const hw = p.el.offsetWidth * sc / 2 + 36;
    p.el.style.transform = `translate(${clamp(sp.x, hw, W - hw)}px, ${Math.max(sp.y, 260)}px) translate(-50%, -100%) scale(${Math.max(0.001, sc)})`;
  }

  [['uchtepa', ramp(t, 0.95, 0.4) * (1 - ramp(t, 2.05, 0.3))],
   ['chilonzor', ramp(t, 2.1, 0.3) * (1 - ramp(t, 2.75, 0.3))],
   ['zangiota', ramp(t, 5.9, 0.35) * (1 - ramp(t, 7.25, 0.35))]].forEach(([k, o]) => {
    const el = dLabels[k], sp = project(v3(PLACES[k], 6));
    const s = 0.8 + 0.2 * easeOutBack(o);
    el.style.opacity = o;
    const hw = el.offsetWidth * s / 2 + 40;
    el.style.transform = `translate(${clamp(sp.x, hw, W - hw)}px, ${clamp(sp.y - 120, 300, 1250)}px) translate(-50%, -50%) scale(${s})`;
  });

  arcs.forEach(a => {
    const k = smooth((t - 7.25 - a.delay) / 0.75);
    a.mesh.geometry.setDrawRange(0, Math.floor(a.seg * k) * a.rad * 6);
    a.mesh.material.opacity = 0.9 * (1 - 0.6 * ramp(t, 8.4, 0.6));
    a.mesh.visible = k > 0;
  });

  titleEl.style.opacity = 1 - ramp(t, 0.75, 0.4);
  titleEl.style.transform = `translateY(${-30 * ramp(t, 0.75, 0.4)}px)`;
  chipEl.style.opacity = ramp(t, 0.9, 0.4);

  let ci = 0; for (let i = 0; i < CHUNK_T.length; i++) if (t >= CHUNK_T[i]) ci = i;
  if (capEl.dataset.ci !== String(ci)) { capEl.innerHTML = ''; capSpans[ci].forEach(s => capEl.appendChild(s)); capEl.dataset.ci = ci; }
  const [s0] = CHUNKS[ci];
  capSpans[ci].forEach((s, j) => s.classList.toggle('on', t >= WORDS[s0 + j][1]));

  renderer.render(scene, camera);
  return true;
};
window.ready = true;
</script>
</body>
</html>
