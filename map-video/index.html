<style>

  .botfade { position: absolute; left: 0; right: 0; bottom: 0; height: 640px; background: linear-gradient(#070b1600, #070b16f2 70%); }

  .label { position: absolute; left: 0; top: 0; transform-origin: 50% 100%; white-space: nowrap; will-change: transform; }
  .card { display: flex; align-items: center; gap: 18px; background: #ffffff; color: #0d1426; padding: 18px 30px 18px 22px; border-radius: 22px; font-weight: 700; font-size: 40px; box-shadow: 0 14px 40px rgba(0,0,0,.45); }
  .card .dot { width: 22px; height: 22px; border-radius: 50%; background: #ffb547; box-shadow: 0 0 0 7px rgba(255,181,71,.28); flex: none; }
  .card .sub { display: block; font-size: 25px; font-weight: 500; color: #5b6478; margin-top: 2px; }
  .card.center { background: #ff4d5e; color: #fff; font-size: 54px; padding: 24px 40px 24px 28px; border-radius: 28px; }
  .card.center .dot { background: #fff; box-shadow: 0 0 0 9px rgba(255,255,255,.3); width: 28px; height: 28px; }
  .card.center .sub { color: #ffe3e6; font-size: 30px; }
  .tail { width: 0; height: 0; margin: 0 auto; border-left: 16px solid transparent; border-right: 16px solid transparent; border-top: 18px solid #fff; }
  .tail.center { border-top-color: #ff4d5e; }

  .district { position: absolute; left: 0; top: 0; transform-origin: 50% 50%; text-align: center; color: #fff; font-weight: 800; font-size: 58px; letter-spacing: 3px; text-transform: uppercase; text-shadow: 0 4px 24px rgba(0,0,0,.8), 0 0 2px rgba(0,0,0,.9); white-space: nowrap; }
  .district small { display: block; font-size: 28px; letter-spacing: 8px; font-weight: 600; color: #9fb8ff; margin-top: 6px; }

  #title { position: absolute; top: 130px; left: 0; right: 0; text-align: center; color: #fff; }
  #title .city { font-size: 96px; font-weight: 900; letter-spacing: 18px; }
  #title .sub { font-size: 32px; font-weight: 600; letter-spacing: 10px; color: #9fb8ff; margin-top: 8px; }

  #caption span { transition: none; }

  #final { position: absolute; left: 0; right: 0; top: 250px; text-align: center; color: #fff; }

<script type="module">
import * as THREE from 'three';

const W = 1080, H = 1920;
// ---------- geo ----------
// 1 unit = 100 m, origin near central Tashkent
const LON0 = 69.24, LAT0 = 41.30;
const P = (lat, lon) => new THREE.Vector2((lon - LON0) * 836.5, -(lat - LAT0) * 1110);

// Approximate (stylized) geography
const PLACES = {
  uchtepa:  P(41.302, 69.172),
  chilonzor:P(41.268, 69.210),
  farhad:   P(41.288, 69.198),
  vatan:    P(41.280, 69.183),
  algoritm: P(41.271, 69.164),
  zangiota: P(41.212, 69.098),
  center:   P(41.292, 69.178),
};
const poly = (arr) => arr.map(([la, lo]) => P(la, lo));
const UCHTEPA = poly([[41.328,69.138],[41.336,69.168],[41.332,69.196],[41.312,69.214],[41.292,69.212],[41.282,69.200],[41.270,69.178],[41.266,69.150],[41.282,69.132],[41.305,69.128]]);
const CHILONZOR = poly([[41.292,69.212],[41.300,69.236],[41.288,69.252],[41.262,69.250],[41.244,69.232],[41.238,69.205],[41.248,69.180],[41.266,69.150],[41.270,69.178],[41.282,69.200]]);
const ZANGIOTA = poly([[41.258,69.118],[41.252,69.150],[41.236,69.178],[41.212,69.190],[41.180,69.170],[41.168,69.120],[41.182,69.060],[41.214,69.040],[41.246,69.070]]);

const RING_C = new THREE.Vector2(12.5, -2), RING_R = new THREE.Vector2(112, 106);
const ringPts = (c, r, n = 160, wob = 0.03, seed = 1) => {
  const a = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n * Math.PI * 2;
    const k = 1 + wob * Math.sin(t * 3 + seed) + wob * 0.6 * Math.sin(t * 5 + seed * 2);
    a.push(new THREE.Vector2(c.x + Math.cos(t) * r.x * k, c.y + Math.sin(t) * r.y * k));
  }
  return a;
};
const KAD = ringPts(RING_C, RING_R, 200, 0.035, 0.7);
const SMALL_RING = ringPts(new THREE.Vector2(18, -10), new THREE.Vector2(50, 46), 140, 0.05, 2.1);
const ANHOR = poly([[41.42,69.315],[41.38,69.295],[41.35,69.275],[41.325,69.262],[41.305,69.258],[41.285,69.246],[41.262,69.236],[41.235,69.222],[41.19,69.205]]);
const BOZSU = poly([[41.40,69.36],[41.37,69.33],[41.345,69.30],[41.33,69.27],[41.322,69.23],[41.318,69.19],[41.31,69.15],[41.30,69.11],[41.29,69.06]]);
const RADIALS = [
  poly([[41.311,69.262],[41.296,69.236],[41.278,69.214],[41.258,69.188],[41.236,69.160],[41.214,69.128]]), // to south-west
  poly([[41.311,69.262],[41.316,69.220],[41.320,69.180],[41.322,69.140],[41.324,69.100]]),               // to west
  poly([[41.311,69.262],[41.345,69.270],[41.380,69.282],[41.410,69.290]]),
  poly([[41.311,69.262],[41.318,69.300],[41.328,69.340],[41.338,69.380]]),
  poly([[41.311,69.262],[41.285,69.290],[41.255,69.315],[41.225,69.340]]),
  poly([[41.300,69.236],[41.282,69.226],[41.262,69.214],[41.240,69.196]]),
  poly([[41.288,69.198],[41.296,69.176],[41.304,69.150],[41.310,69.120]]),
];

// ---------- helpers ----------
let seed = 12345;
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const smooth = (x) => { x = clamp(x, 0, 1); return x * x * x * (x * (x * 6 - 15) + 10); };
const ramp = (t, a, d) => smooth((t - a) / d);
const lerp = (a, b, k) => a + (b - a) * k;
const easeOutBack = (x) => { x = clamp(x, 0, 1); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
function inPoly(p, poly) {
  let ins = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const a = poly[i], b = poly[j];
    if (((a.y > p.y) !== (b.y > p.y)) && (p.x < (b.x - a.x) * (p.y - a.y) / (b.y - a.y) + a.x)) ins = !ins;
  }
  return ins;
}
function distToLine(p, line) {
  let best = 1e9;
  for (let i = 0; i < line.length - 1; i++) {
    const a = line[i], b = line[i + 1];
    const ab = b.clone().sub(a), ap = p.clone().sub(a);
    const t = clamp(ap.dot(ab) / ab.lengthSq(), 0, 1);
    best = Math.min(best, a.clone().addScaledVector(ab, t).distanceTo(p));
  }
  return best;
}
const v3 = (p, y = 0) => new THREE.Vector3(p.x, y, p.y);

// ribbon along a 2D polyline, lying on ground
function ribbon(pts, width, y) {
  const pos = [], idx = [];
  for (let i = 0; i < pts.length; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
    const d = b.clone().sub(a).normalize();
    const n = new THREE.Vector2(-d.y, d.x).multiplyScalar(width / 2);
    pos.push(pts[i].x + n.x, y, pts[i].y + n.y, pts[i].x - n.x, y, pts[i].y - n.y);
    if (i < pts.length - 1) { const k = i * 2; idx.push(k, k + 1, k + 2, k + 1, k + 3, k + 2); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  return g;
}
const densify = (pts, step = 1.5) => {
  const out = [];
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1], n = Math.max(1, Math.ceil(a.distanceTo(b) / step));
    for (let k = 0; k < n; k++) out.push(a.clone().lerp(b, k / n));
  }
  out.push(pts[pts.length - 1].clone());
  return out;
};
const closed = (pts) => [...pts, pts[0]];

// ---------- renderer ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#070b16');
scene.fog = new THREE.Fog('#070b16', 220, 620);
const camera = new THREE.PerspectiveCamera(42, W / H, 1, 3000);

scene.add(new THREE.HemisphereLight('#b4c8ff', '#0a0f1e', 1.5));
const sun = new THREE.DirectionalLight('#ffe2c0', 1.6);
sun.position.set(-120, 200, 140);
scene.add(sun);

// ground
const ground = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000), new THREE.MeshBasicMaterial({ color: '#0a1020' }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.05;
scene.add(ground);

// city surface with street texture
function streetTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 2048;
  const g = c.getContext('2d');
  g.fillStyle = '#121b31'; g.fillRect(0, 0, 2048, 2048);
  seed = 777;
  for (let pass = 0; pass < 2; pass++) {
    const ang = pass === 0 ? 0.42 : 0.42 + Math.PI / 2;
    g.save(); g.translate(1024, 1024); g.rotate(ang);
    for (let x = -1500; x < 1500; x += 18 + rnd() * 26) {
      g.strokeStyle = `rgba(130,160,230,${0.08 + rnd() * 0.12})`;
      g.lineWidth = 1 + rnd() * 2;
      g.beginPath(); g.moveTo(x, -1500); g.lineTo(x + (rnd() - .5) * 60, 1500); g.stroke();
    }
    g.restore();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  return t;
}
const cityShape = new THREE.Shape(KAD.map(p => new THREE.Vector2(p.x, -p.y)));
const cityMesh = new THREE.Mesh(new THREE.ShapeGeometry(cityShape), new THREE.MeshBasicMaterial({ map: streetTexture() }));
cityMesh.rotation.x = -Math.PI / 2;
{ // UVs
  const pa = cityMesh.geometry.attributes.position, uv = [];
  for (let i = 0; i < pa.count; i++) uv.push((pa.getX(i) + 140) / 280, (pa.getY(i) + 140) / 280);
  cityMesh.geometry.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
}
scene.add(cityMesh);

// district fills + outlines
function districtLayer(polyPts, color) {
  const shape = new THREE.Shape(polyPts.map(p => new THREE.Vector2(p.x, -p.y)));
  const fill = new THREE.Mesh(new THREE.ShapeGeometry(shape), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0, depthWrite: false }));
  fill.rotation.x = -Math.PI / 2; fill.position.y = 0.08;
  const line = new THREE.Mesh(ribbon(densify(closed(polyPts), 1), 0.9, 0.12), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0, depthWrite: false }));
  const glow = new THREE.Mesh(ribbon(densify(closed(polyPts), 1), 3.2, 0.1), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending }));
  scene.add(fill, glow, line);
  return { fill, line, glow, set(h, lineOn) { fill.material.opacity = 0.32 * h; line.material.opacity = lineOn; glow.material.opacity = 0.35 * lineOn; } };
}
const dUch = districtLayer(UCHTEPA, '#5b8cff');
const dChi = districtLayer(CHILONZOR, '#36d1b5');
const dZan = districtLayer(ZANGIOTA, '#b77dff');

// zangiota fields
{
  const shape = new THREE.Shape(ZANGIOTA.map(p => new THREE.Vector2(p.x, -p.y)));
  const m = new THREE.Mesh(new THREE.ShapeGeometry(shape), new THREE.MeshBasicMaterial({ color: '#0f1a24' }));
  m.rotation.x = -Math.PI / 2; m.position.y = 0.0;
  scene.add(m);
}

// roads & water
const roadMat = new THREE.MeshBasicMaterial({ color: '#c9d6ff', transparent: true, opacity: 0.55 });
const roadMat2 = new THREE.MeshBasicMaterial({ color: '#8ea3d8', transparent: true, opacity: 0.38 });
scene.add(new THREE.Mesh(ribbon(densify(KAD, 1.5), 1.4, 0.15), roadMat));
scene.add(new THREE.Mesh(ribbon(densify(SMALL_RING, 1.5), 1.0, 0.15), roadMat2));
RADIALS.forEach(r => scene.add(new THREE.Mesh(ribbon(densify(r, 1.5), 0.9, 0.15), roadMat2)));
const waterMat = new THREE.MeshBasicMaterial({ color: '#2fb6d6', transparent: true, opacity: 0.85 });
scene.add(new THREE.Mesh(ribbon(densify(ANHOR, 1), 1.3, 0.17), waterMat));
scene.add(new THREE.Mesh(ribbon(densify(BOZSU, 1), 1.0, 0.17), waterMat));

// buildings
const blocks = [];
const avoid = [ANHOR, BOZSU, KAD, SMALL_RING, ...RADIALS];
seed = 4242;
const CITY_CORE = P(41.312, 69.255);
let tries = 0;
while (blocks.length < 9000 && tries < 60000) {
  tries++;
  const u = Math.sqrt(rnd()), a = rnd() * Math.PI * 2;
  const p = new THREE.Vector2(RING_C.x + Math.cos(a) * RING_R.x * u * 0.97, RING_C.y + Math.sin(a) * RING_R.y * u * 0.97);
  if (rnd() > 0.45 + 0.55 * (1 - u)) continue;
  if (avoid.some(l => distToLine(p, l) < 1.4)) continue;
  const dc = p.distanceTo(CITY_CORE);
  let h = 0.35 + Math.pow(rnd(), 3) * 2.2;
  if (dc < 25 && rnd() < 0.15) h += 2 + rnd() * 4;
  blocks.push({ p, h, w: 0.6 + rnd() * 1.1, d: 0.6 + rnd() * 1.1, r: rnd() * 0.4 });
}
tries = 0;
while (tries < 5000) { // village houses in Zangiota
  tries++;
  const p = new THREE.Vector2(lerp(-150, -60, rnd()), lerp(55, 150, rnd()));
  if (!inPoly(p, ZANGIOTA) || rnd() > 0.35) continue;
  blocks.push({ p, h: 0.25 + rnd() * 0.35, w: 0.5 + rnd() * 0.6, d: 0.5 + rnd() * 0.6, r: rnd() });
}
blocks.forEach(b => { b.zone = inPoly(b.p, UCHTEPA) ? 1 : inPoly(b.p, CHILONZOR) ? 2 : inPoly(b.p, ZANGIOTA) ? 3 : 0; });
const bGeo = new THREE.BoxGeometry(1, 1, 1); bGeo.translate(0, 0.5, 0);
const bMat = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.85, metalness: 0.05 });
const bMesh = new THREE.InstancedMesh(bGeo, bMat, blocks.length);
{
  const m = new THREE.Matrix4(), q = new THREE.Quaternion();
  blocks.forEach((b, i) => {
    q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), 0.42 + b.r * 0.2);
    m.compose(v3(b.p), q, new THREE.Vector3(b.w, b.h, b.d));
    bMesh.setMatrixAt(i, m);
    bMesh.setColorAt(i, new THREE.Color('#33466e'));
  });
}
scene.add(bMesh);
const BASE = new THREE.Color('#3b5285'), C_UCH = new THREE.Color('#7aa2ff'), C_CHI = new THREE.Color('#4fe0c4'), C_ZAN = new THREE.Color('#c79bff');

// pins
const labelsEl = document.getElementById('labels');
function makePin(key, title, sub, color, big = false) {
  const g = new THREE.Group();
  const s = big ? 1.6 : 1;
  const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.18 * s, 0.18 * s, 1, 12, 1, true).translate(0, 0.5, 0),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.85, blending: THREE.AdditiveBlending, depthWrite: false }));
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.9 * s, 24, 16), new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.6 }));
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.8, 1.2, 48).rotateX(-Math.PI / 2),
    new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.8, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending }));
  const ring2 = ring.clone(); ring2.material = ring.material.clone();
  const disc = new THREE.Mesh(new THREE.CircleGeometry(1.4 * s, 40).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.5, depthWrite: false }));
  ring.position.y = ring2.position.y = 0.2; disc.position.y = 0.19;
  g.add(beam, head, ring, ring2, disc);
  g.position.copy(v3(PLACES[key]));
  scene.add(g);
  const el = document.createElement('div');
  el.className = 'label';
  el.innerHTML = `<div class="card ${big ? 'center' : ''}"><span class="dot"></span><span>${title}${sub ? `<span class="sub">${sub}</span>` : ''}</span></div><div class="tail ${big ? 'center' : ''}"></div>`;
  labelsEl.appendChild(el);
  return { g, beam, head, ring, ring2, disc, el, s, big, h: big ? 9 : 6.5 };
}
const pins = {
  farhad:   makePin('farhad', 'Фархадский рынок', 'Farhod bozori', '#ffb547'),

  center:   makePin('center', 'НАШ ЦЕНТР', 'Bizning markaz', '#ff4d5e', true),
};

// district labels
function districtLabel(key, name, sub) {
  const el = document.createElement('div'); el.className = 'district';

}
const dLabels = {
  uchtepa:  districtLabel('uchtepa', 'Учтепинский район', 'UCHTEPA'),

};

// arcs from center
const arcs = ['farhad', 'vatan', 'algoritm', 'chilonzor', 'zangiota', 'uchtepa'].map((k, i) => {
  const a = v3(PLACES.center, 0.4), b = v3(PLACES[k], 0.4);
  const mid = a.clone().lerp(b, 0.5); mid.y = 4 + a.distanceTo(b) * 0.28;
  const curve = new THREE.QuadraticBezierCurve3(a, mid, b);
  const seg = 80, rad = 8;
  const geo = new THREE.TubeGeometry(curve, seg, 0.2, rad, false);

  mesh.frustumCulled = false;
  scene.add(mesh);
  return { mesh, seg, rad, delay: i * 0.08 };
});

const WORDS = [["Если",0.12],["вы",0.32],["живёте",0.46],["в",0.9],["Учтепинском",0.96,1],["районе:",1.54,1],

const CHUNKS = [[0, 6], [6, 12], [12, 17], [17, 26]];

// ---------- camera keyframes ----------
// t, target x, target z, distance, polar(deg from vertical), azimuth(deg)
const T = (k) => PLACES[k];
const KF = [
  [0.0,  10, -4, 300, 32, -30],
  [0.6,   0,  0, 280, 36, -26],
  [1.6, T('uchtepa').x, T('uchtepa').y + 4, 165, 46, -12],
  [2.5, T('chilonzor').x - 4, T('chilonzor').y - 4, 150, 50, -2],
  [3.1, T('farhad').x, T('farhad').y, 62, 54, 8],
  [4.3, T('vatan').x, T('vatan').y, 62, 56, 18],
  [5.45, T('algoritm').x, T('algoritm').y, 62, 56, 28],
  [6.6, -98, 70, 250, 32, 8],
  [7.75, -58, 28, 175, 48, 6],
  [8.7, T('center').x, T('center').y, 82, 54, -14],
  [10.5, T('center').x, T('center').y, 64, 58, -36],
];
function camAt(t) {
  let i = 0; while (i < KF.length - 2 && t > KF[i + 1][0]) i++;
  const a = KF[i], b = KF[i + 1];
  const k = smooth((t - a[0]) / (b[0] - a[0]));
  const tx = lerp(a[1], b[1], k), tz = lerp(a[2], b[2], k);
  const dist = Math.exp(lerp(Math.log(a[3]), Math.log(b[3]), k));
  const pol = THREE.MathUtils.degToRad(lerp(a[4], b[4], k));
  const az = THREE.MathUtils.degToRad(lerp(a[5], b[5], k) + t * 1.5);
  camera.position.set(tx + dist * Math.sin(pol) * Math.sin(az), dist * Math.cos(pol), tz + dist * Math.sin(pol) * Math.cos(az));
  camera.lookAt(tx, 3, tz);
  camera.updateMatrixWorld();
  return dist;
}

// ---------- frame ----------
const tmp = new THREE.Vector3();
function project(p3) {
  tmp.copy(p3).project(camera);
  return { x: (tmp.x * 0.5 + 0.5) * W, y: (-tmp.y * 0.5 + 0.5) * H, vis: tmp.z < 1 };
}
const titleEl = document.getElementById('title'), chipEl = document.getElementById('chip');

window.renderAt = function (t) {
  const dist = camAt(t);

  // district highlight levels
  const hU = ramp(t, 0.9, 0.5) * (1 - 0.55 * ramp(t, 2.1, 0.4)) + 0.25 * ramp(t, 8.0, 0.6);
  const hC = ramp(t, 2.05, 0.4) * (1 - 0.6 * ramp(t, 2.8, 0.5));
  const hZ = ramp(t, 5.85, 0.4) * (1 - 0.55 * ramp(t, 7.3, 0.5));
  dUch.set(hU, ramp(t, 0.9, 0.5));
  dChi.set(hC, ramp(t, 2.05, 0.4) * (1 - 0.5 * ramp(t, 2.8, 0.5)));
  dZan.set(hZ, ramp(t, 5.85, 0.4) * (1 - 0.5 * ramp(t, 7.3, 0.5)));
  const col = new THREE.Color();
  blocks.forEach((b, i) => {
    col.copy(BASE);
    if (b.zone === 1) col.lerp(C_UCH, hU * 0.75);
    else if (b.zone === 2) col.lerp(C_CHI, hC * 0.75);
    else if (b.zone === 3) col.lerp(C_ZAN, hZ * 0.8);
    bMesh.setColorAt(i, col);
  });
  bMesh.instanceColor.needsUpdate = true;

  // pins
  const labelScale = clamp(95 / dist, 0.5, 1.05);
  for (const [k, p] of Object.entries(pins)) {
    const t0 = PIN_T[k], a = t - t0;
    const pop = easeOutBack(a / 0.55), grow = smooth(a / 0.5);
    const visible = a > 0;
    p.g.visible = visible;
    if (!visible) { p.el.style.opacity = 0; continue; }
    p.beam.scale.set(1, p.h * grow, 1);
    p.head.position.y = p.h * grow;
    p.head.scale.setScalar(Math.max(0.001, pop));
    const pulse = (x) => { const f = ((a * 0.9 + x) % 1); return f; };
    [p.ring, p.ring2].forEach((r, j) => { const f = pulse(j * 0.5); r.scale.setScalar((1 + f * 4) * p.s); r.material.opacity = 0.8 * (1 - f) * grow; });
    p.disc.scale.setScalar(Math.max(0.001, pop));
    const sp = project(new THREE.Vector3(p.g.position.x, p.h + 1.2 * p.s, p.g.position.z));
    let sc = (p.big ? clamp(70 / dist, 0.6, 1.15) : labelScale) * pop;
    if (p.big) sc *= 1 + 0.12 * ramp(t, 8.1, 0.4);
    const far = p.big ? 1 : 1 - ramp(dist, 160, 50);
    p.el.style.opacity = sp.vis ? clamp(a / 0.25, 0, 1) * far : 0;
    const hw = p.el.offsetWidth * sc / 2 + 36;
    const x = clamp(sp.x, hw, W - hw);
    p.el.style.transform = `translate(${x}px, ${sp.y}px) translate(-50%, -100%) scale(${Math.max(0.001, sc)})`;
  }
  // non-center pins dim slightly at the finale
  ['farhad', 'vatan', 'algoritm'].forEach(k => { if (t > 8.1) pins[k].el.style.opacity *= 1 - 0.8 * ramp(t, 8.2, 0.5); });

  // district labels
  const dl = [
    ['uchtepa', ramp(t, 0.95, 0.4) * (1 - ramp(t, 2.05, 0.3)) + 0.0],
    ['chilonzor', ramp(t, 2.1, 0.3) * (1 - ramp(t, 2.75, 0.3))],
    ['zangiota', ramp(t, 5.9, 0.35) * (1 - ramp(t, 7.25, 0.35))],
  ];
  dl.forEach(([k, o]) => {
    const L = dLabels[k], sp = project(v3(PLACES[k], 3));
    const s = 0.85 + 0.15 * smooth(o);
    L.el.style.opacity = o;
    const hw = L.el.offsetWidth * s / 2 + 40;
    L.el.style.transform = `translate(${clamp(sp.x, hw, W - hw)}px, ${clamp(sp.y, 300, 1300)}px) translate(-50%, -50%) scale(${s})`;
  });

  // arcs
  arcs.forEach(a => {
    const k = smooth((t - 7.25 - a.delay) / 0.75);
    a.mesh.geometry.setDrawRange(0, Math.floor(a.seg * k) * a.rad * 6);
    a.mesh.material.opacity = 0.8 * (1 - 0.75 * ramp(t, 8.4, 0.6));
    a.mesh.visible = k > 0;
  });

  // overlays
  titleEl.style.opacity = 1 - ramp(t, 0.7, 0.4);
  titleEl.style.transform = `translateY(${-30 * ramp(t, 0.7, 0.4)}px)`;
  chipEl.style.opacity = ramp(t, 0.9, 0.4) * (1 - ramp(t, 8.0, 0.4));

  // captions
  let ci = 0; for (let i = 0; i < CHUNK_T.length; i++) if (t >= CHUNK_T[i]) ci = i;
  if (capEl.dataset.ci !== String(ci)) { capEl.innerHTML = ''; capSpans[ci].forEach(s => capEl.appendChild(s)); capEl.dataset.ci = ci; }
  const [s0] = CHUNKS[ci];
  capSpans[ci].forEach((s, j) => s.classList.toggle('on', t >= WORDS[s0 + j][1]));

  renderer.render(scene, camera);
  return true;
};
window.ready = true;
</script>
