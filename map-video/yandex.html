<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; padding: 0; width: 1080px; height: 1920px; overflow: hidden; background: #f5f3ef; font-family: "Inter", "DejaVu Sans", sans-serif; }
  #c { position: absolute; inset: 0; }
  #overlay { position: absolute; inset: 0; pointer-events: none; }
  .botfade { position: absolute; left: 0; right: 0; bottom: 0; height: 600px; background: linear-gradient(rgba(16,20,32,0), rgba(16,20,32,.8) 62%); }
  .topfade { position: absolute; left: 0; right: 0; top: 0; height: 260px; background: linear-gradient(rgba(245,243,239,.9), rgba(245,243,239,0)); }

  .label { position: absolute; left: 0; top: 0; transform-origin: 50% 100%; white-space: nowrap; will-change: transform; }
  .card { display: flex; align-items: center; gap: 18px; background: #1b2233; color: #fff; padding: 18px 30px 18px 22px; border-radius: 22px; font-weight: 700; font-size: 40px; box-shadow: 0 14px 34px rgba(20,15,10,.35); }
  .card .dot { width: 22px; height: 22px; border-radius: 50%; background: #ffb547; box-shadow: 0 0 0 7px rgba(255,181,71,.3); flex: none; }
  .card .sub { display: block; font-size: 25px; font-weight: 500; color: #b9c2d6; margin-top: 2px; }
  .card.metro .dot { background: #e5383b; box-shadow: 0 0 0 7px rgba(229,56,59,.3); }
  .card.center { background: #e5383b; font-size: 54px; padding: 24px 40px 24px 28px; border-radius: 28px; }
  .card.center .dot { background: #fff; box-shadow: 0 0 0 9px rgba(255,255,255,.3); width: 28px; height: 28px; }
  .card.center .sub { color: #ffe0e1; font-size: 30px; }
  .tail { width: 0; height: 0; margin: 0 auto; border-left: 16px solid transparent; border-right: 16px solid transparent; border-top: 18px solid #1b2233; }
  .tail.center { border-top-color: #e5383b; }

  .poi { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 10px; white-space: nowrap; font-size: 27px; font-weight: 600; color: #3a3632; text-shadow: 0 0 4px #fff, 0 0 4px #fff, 0 0 6px #fff; }
  .poi i { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-style: normal; font-size: 22px; font-weight: 800; color: #fff; text-shadow: none; box-shadow: 0 2px 6px rgba(0,0,0,.25); border: 3px solid #fff; flex: none; }

  .district { position: absolute; left: 0; top: 0; text-align: center; font-weight: 900; font-size: 60px; letter-spacing: 2px; text-transform: uppercase; white-space: nowrap; color: #fff; padding: 16px 34px; border-radius: 20px; box-shadow: 0 14px 34px rgba(20,15,10,.3); }
  .district small { display: block; font-size: 26px; letter-spacing: 8px; font-weight: 700; opacity: .85; margin-top: 4px; }

  #title { position: absolute; top: 140px; left: 0; right: 0; text-align: center; color: #1b2233; }
  #title .city { font-size: 100px; font-weight: 900; letter-spacing: 18px; }
  #title .sub { font-size: 32px; font-weight: 700; letter-spacing: 10px; color: #e5383b; margin-top: 6px; }
  #chip { position: absolute; top: 110px; left: 60px; display: flex; align-items: center; gap: 14px; background: rgba(27,34,51,.9); color: #fff; padding: 14px 26px; border-radius: 40px; font-size: 30px; font-weight: 600; }
  #chip i { width: 14px; height: 14px; border-radius: 50%; background: #e5383b; display: block; }
  #caption { position: absolute; left: 70px; right: 70px; bottom: 200px; text-align: center; font-size: 56px; line-height: 1.28; font-weight: 800; color: rgba(255,255,255,.38); }
  #caption span.on { color: #ffffff; }
  #caption span.key.on { color: #ffb547; }
  #credit { position: absolute; right: 24px; bottom: 24px; font-size: 18px; color: rgba(255,255,255,.55); }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<div id="overlay">
  <div class="topfade"></div>
  <div class="botfade"></div>
  <div id="pois"></div>
  <div id="labels"></div>
  <div id="title"><div class="city">ТАШКЕНТ</div><div class="sub">TOSHKENT SHAHRI</div></div>
  <div id="chip"><i></i>Ташкент · Учтепа · Чиланзар</div>
  <div id="caption"></div>
  <div id="credit">© OpenStreetMap contributors, Overture Maps</div>
</div>

<script type="importmap">{ "imports": { "three": "./node_modules/three/build/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';

const W = 1080, H = 1920;
const S = await (await fetch('y/scene.json')).json();
const V2 = (a) => new THREE.Vector2(a[0], a[1]);
const v3 = (p, y = 0) => new THREE.Vector3(p.x, y, p.y);
const LON0 = 69.19, LAT0 = 41.28, KX = 111320 * Math.cos(LAT0 * Math.PI / 180) / 10, KZ = 110574 / 10;
const G = (lat, lon) => new THREE.Vector2((lon - LON0) * KX, -(lat - LAT0) * KZ);

const PL = Object.fromEntries(Object.entries(S.places).map(([k, v]) => [k, V2(v)]));
const DC = Object.fromEntries(Object.entries(S.districtCenter).map(([k, v]) => [k, V2(v)]));

// ---------- helpers ----------
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const smooth = (x) => { x = clamp(x, 0, 1); return x * x * x * (x * (x * 6 - 15) + 10); };
const ramp = (t, a, d) => smooth((t - a) / d);
const lerp = (a, b, k) => a + (b - a) * k;
const easeOutBack = (x) => { x = clamp(x, 0, 1); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
function ribbon(pts, width, y) {
  const pos = [], idx = [];
  for (let i = 0; i < pts.length; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
    const d = b.clone().sub(a).normalize();
    const n = new THREE.Vector2(-d.y, d.x).multiplyScalar(width / 2);
    pos.push(pts[i].x + n.x, y, pts[i].y + n.y, pts[i].x - n.x, y, pts[i].y - n.y);
    if (i < pts.length - 1) { const k = i * 2; idx.push(k, k + 1, k + 2, k + 1, k + 3, k + 2); }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  return g;
}
function wall(pts) { // vertical band along a closed polyline, v = 0 bottom .. 1 top
  const pos = [], uv = [], idx = [];
  pts.forEach((p, i) => { pos.push(p.x, 0, p.y, p.x, 1, p.y); uv.push(0, 0, 0, 1); if (i < pts.length - 1) { const k = i * 2; idx.push(k, k + 2, k + 1, k + 1, k + 2, k + 3); } });
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  return g;
}

// ---------- renderer ----------
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true, logarithmicDepthBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
const scene = new THREE.Scene();
scene.background = new THREE.Color('#f5f3ef');
scene.fog = new THREE.Fog('#f5f3ef', 1000, 5000);
const camera = new THREE.PerspectiveCamera(40, W / H, 1, 50000);
scene.add(new THREE.HemisphereLight('#ffffff', '#bfb3a5', 1.9));
const sun = new THREE.DirectionalLight('#fff6ea', 1.5);
sun.position.set(-300, 700, 450);
scene.add(sun);

// ---------- ground textures ----------
const loader = new THREE.TextureLoader();
const maxAniso = renderer.capabilities.getMaxAnisotropy();
async function groundPlane(url, b, y, offset) {
  const tex = await loader.loadAsync(url);
  tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = maxAniso;
  const w = b[2] - b[0], h = b[3] - b[1];
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tex, polygonOffset: true, polygonOffsetFactor: offset, polygonOffsetUnits: offset }));
  m.rotation.x = -Math.PI / 2; m.position.set((b[0] + b[2]) / 2, y, (b[1] + b[3]) / 2);
  scene.add(m);
  return m;
}
const floor = new THREE.Mesh(new THREE.PlaneGeometry(200000, 200000), new THREE.MeshBasicMaterial({ color: '#f5f3ef' }));
floor.rotation.x = -Math.PI / 2; floor.position.y = -1;
scene.add(floor);
await groundPlane('y/wide.jpg', S.wide, 0, 0);
await groundPlane('y/detail.jpg', S.detail, 0.3, -4);

// ---------- 3D buildings ----------
const HL = { value: new THREE.Vector3() };
{
  const buf = await (await fetch('y/buildings.bin')).arrayBuffer();
  const n = new Uint32Array(buf, 0, 1)[0];
  const pos = new Float32Array(buf, 4, n * 3);
  const col = new Uint8Array(buf, 4 + n * 12, n * 3);
  const zone = new Uint8Array(buf, 4 + n * 15, n);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3, true));
  g.setAttribute('zone', new THREE.BufferAttribute(new Float32Array(zone), 1));
  g.computeVertexNormals();
  const mat = new THREE.MeshLambertMaterial({ vertexColors: true });
  mat.onBeforeCompile = (sh) => {
    sh.uniforms.hl = HL;
    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nattribute float zone;\nuniform vec3 hl;')
      .replace('#include <color_vertex>', `#include <color_vertex>
        vec3 zc = zone < 0.5 ? vec3(0.) : zone < 1.5 ? vec3(0.24,0.48,1.0) : zone < 2.5 ? vec3(0.07,0.72,0.53) : vec3(0.55,0.36,0.96);
        float zh = zone < 0.5 ? 0. : zone < 1.5 ? hl.x : zone < 2.5 ? hl.y : hl.z;
        vColor.rgb = mix(vColor.rgb, zc, zh * 0.55);`);
  };
  const mesh = new THREE.Mesh(g, mat);
  mesh.frustumCulled = false;
  scene.add(mesh);
}

// ---------- districts ----------
function gradTex() {
  const c = document.createElement('canvas'); c.width = 4; c.height = 128;
  const x = c.getContext('2d'), gr = x.createLinearGradient(0, 128, 0, 0);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  x.fillStyle = gr; x.fillRect(0, 0, 4, 128);
  return new THREE.CanvasTexture(c);
}
const GRAD = gradTex();
function district(key, color) {
  const pts = S.districts[key].map(V2);
  const shape = new THREE.Shape(pts.map(p => new THREE.Vector2(p.x, -p.y)));
  const fill = new THREE.Mesh(new THREE.ShapeGeometry(shape), new THREE.MeshBasicMaterial({ color, transparent: true, depthWrite: false }));
  fill.rotation.x = -Math.PI / 2; fill.position.y = 0.6;
  const fence = new THREE.Mesh(wall(pts), new THREE.MeshBasicMaterial({ color, transparent: true, alphaMap: GRAD, side: THREE.DoubleSide, depthWrite: false }));
  const line = new THREE.Mesh(ribbon(pts, 6, 0.7), new THREE.MeshBasicMaterial({ color, transparent: true, depthWrite: false }));
  scene.add(fill, fence, line);
  return {
    set(h, lift, dist) {
      const vis = h > 0.002;
      fill.visible = fence.visible = line.visible = vis;
      fill.material.opacity = 0.22 * h;
      fence.scale.y = Math.max(0.01, lift) * clamp(dist * 0.022, 6, 60);
      fence.material.opacity = 0.6 * h;
      line.scale.set(1, 1, 1);
      line.material.opacity = h;
    },
  };
}
const dUch = district('uchtepa', '#3d7bff');
const dChi = district('chilonzor', '#12b886');
const dZan = district('zangiota', '#8b5cf6');

// ---------- pins ----------
const labelsEl = document.getElementById('labels');
function makePin(at, title, sub, color, kind = '') {
  const big = kind === 'center';
  const g = new THREE.Group();
  const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 1, 12).translate(0, 0.5, 0), new THREE.MeshLambertMaterial({ color: '#2a3145' }));
  const head = new THREE.Mesh(new THREE.SphereGeometry(2.4, 28, 18), new THREE.MeshLambertMaterial({ color, emissive: color, emissiveIntensity: 0.35 }));
  const ringMat = new THREE.MeshBasicMaterial({ color, transparent: true, side: THREE.DoubleSide, depthWrite: false });
  const ring = new THREE.Mesh(new THREE.RingGeometry(2, 3, 48).rotateX(-Math.PI / 2), ringMat);
  const ring2 = new THREE.Mesh(ring.geometry, ringMat.clone());
  const disc = new THREE.Mesh(new THREE.CircleGeometry(3, 40).rotateX(-Math.PI / 2), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.8, depthWrite: false }));
  ring.position.y = ring2.position.y = 0.6; disc.position.y = 0.5;
  g.add(beam, head, ring, ring2, disc);
  g.position.copy(v3(at));
  scene.add(g);
  const el = document.createElement('div');
  el.className = 'label';
  el.innerHTML = `<div class="card ${kind}"><span class="dot"></span><span>${title}${sub ? `<span class="sub">${sub}</span>` : ''}</span></div><div class="tail ${big ? 'center' : ''}"></div>`;
  labelsEl.appendChild(el);
  return { g, beam, head, ring, ring2, disc, el, big, h: big ? 30 : 22 };
}
const pins = {
  metro:    makePin(PL.metro, 'Метро «Чиланзар»', 'Chilonzor metro bekati', '#e5383b', 'metro'),
  farhad:   makePin(PL.farhad, 'Фархадский рынок', 'Farhod bozori', '#ff9f1c'),
  vatan:    makePin(PL.vatan, 'Кинотеатр «Ватан»', 'Vatan kinoteatri', '#ff9f1c'),
  algoritm: makePin(PL.algoritm, 'Алгоритм', 'Algoritm', '#ff9f1c'),
  center:   makePin(PL.center, 'НАШ ЦЕНТР', 'Чиланзар 12/56', '#e5383b', 'center'),
};
const PIN_T = { metro: 2.15, farhad: 2.7, vatan: 3.88, algoritm: 5.04, center: 7.2 };

// ---------- POIs (main landmarks) ----------
const ICON = { gov: ['#4a5a7a', '★'], metro: ['#e5383b', 'M'], mall: ['#f08c00', '◆'], sport: ['#2f9e44', '●'], park: ['#2f9e44', '✿'], mosque: ['#1c7ed6', '☾'], med: ['#e03131', '+'], bus: ['#1971c2', 'A'] };
const poisEl = document.getElementById('pois');
const pois = S.pois.map(([kind, name, p]) => {
  const el = document.createElement('div'); el.className = 'poi';
  const [c, s] = ICON[kind];
  el.innerHTML = `<i style="background:${c}">${s}</i><span>${name}</span>`;
  poisEl.appendChild(el);
  return { el, p: V2(p) };
});

function districtLabel(name, sub, bg) {
  const el = document.createElement('div'); el.className = 'district';
  el.style.background = bg;
  el.innerHTML = `${name}<small>${sub}</small>`;
  labelsEl.appendChild(el);
  return el;
}
const dLabels = {
  uchtepa:   districtLabel('Учтепинский район', 'UCHTEPA TUMANI', '#3d7bff'),
  chilonzor: districtLabel('Чиланзарский район', 'CHILONZOR TUMANI', '#12b886'),
  zangiota:  districtLabel('Зангиатинский район', 'ZANGIOTA TUMANI', '#8b5cf6'),
};
const DL_AT = { uchtepa: DC.uchtepa, chilonzor: PL.metro, zangiota: DC.zangiota };

// arcs from center to each place
const arcTargets = [PL.farhad, PL.vatan, PL.algoritm, PL.metro, DC.zangiota.clone().lerp(PL.center, 0.55), DC.uchtepa];
const arcs = arcTargets.map((tp, i) => {
  const a = v3(PL.center, 1), b = v3(tp, 1);
  const mid = a.clone().lerp(b, 0.5); mid.y = 10 + a.distanceTo(b) * 0.3;
  const curve = new THREE.QuadraticBezierCurve3(a, mid, b);
  const seg = 80, rad = 8;
  const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, seg, 1, rad, false), new THREE.MeshBasicMaterial({ color: '#e5383b', transparent: true }));
  mesh.frustumCulled = false;
  scene.add(mesh);
  return { mesh, seg, rad, delay: i * 0.08 };
});

// ---------- captions ----------
const WORDS = [["Если",0.12],["вы",0.32],["живёте",0.46],["в",0.9],["Учтепинском",0.96,1],["районе:",1.54,1],
  ["Чиланзар,",2.1,1],["Фархадский",2.7,1],["рынок,",3.24,1],["кинотеатр",3.88,1],["Ватан,",4.48,1],["Алгоритм,",5.04,1],
  ["Зангиатинский",5.9,1],["район",6.68,1],["для",7.24],["вас",7.42],["близко,",7.66],
  ["то",8.1],["наш",8.24,1],["центр",8.48,1],["—",8.6],["именно",8.84],["то,",9.14],["что",9.3],["вы",9.5],["ищете",9.72]];
const CHUNKS = [[0, 6], [6, 12], [12, 17], [17, 26]];
const CHUNK_T = [0, 2.05, 5.85, 8.05];
const capEl = document.getElementById('caption');
const capSpans = CHUNKS.map(([a, b]) => WORDS.slice(a, b).map(w => { const s = document.createElement('span'); s.textContent = w[0] + ' '; if (w[2]) s.className = 'key'; return s; }));

// ---------- camera ----------
const mid = (a, b, k = 0.5) => a.clone().lerp(b, k);
const ALL = PL.farhad.clone().add(PL.vatan).add(PL.algoritm).add(PL.metro).add(PL.center).multiplyScalar(0.2);
// t, target, distance, polar(deg), azimuth(deg)
const KF = [
  [0.0,  G(41.300, 69.240), 4300, 12, -6],
  [0.7,  G(41.295, 69.225), 3600, 20, -6],
  [1.6,  DC.uchtepa, 1500, 40, -10],
  [2.5,  PL.metro, 850, 46, -4],
  [3.1,  PL.farhad, 280, 52, 6],
  [4.3,  PL.vatan, 280, 54, 14],
  [5.45, PL.algoritm, 280, 54, 22],
  [6.6,  mid(DC.zangiota, PL.center, 0.45), 2600, 36, 10],
  [7.75, ALL, 950, 46, 2],
  [8.7,  PL.center, 280, 52, -12],
  [10.5, PL.center, 210, 56, -32],
];
function camAt(t) {
  let i = 0; while (i < KF.length - 2 && t > KF[i + 1][0]) i++;
  const a = KF[i], b = KF[i + 1];
  const k = smooth((t - a[0]) / (b[0] - a[0]));
  const tx = lerp(a[1].x, b[1].x, k), tz = lerp(a[1].y, b[1].y, k);
  const dist = Math.exp(lerp(Math.log(a[2]), Math.log(b[2]), k));
  const pol = THREE.MathUtils.degToRad(lerp(a[3], b[3], k));
  const az = THREE.MathUtils.degToRad(lerp(a[4], b[4], k) + t * 1.5);
  camera.position.set(tx + dist * Math.sin(pol) * Math.sin(az), dist * Math.cos(pol), tz + dist * Math.sin(pol) * Math.cos(az));
  camera.lookAt(tx, 0, tz);
  camera.near = Math.max(0.5, dist / 200); camera.far = dist * 30; camera.updateProjectionMatrix();
  camera.updateMatrixWorld();
  scene.fog.near = dist * 1.6; scene.fog.far = dist * 5;
  return dist;
}
const tmp = new THREE.Vector3();
function project(p3) { tmp.copy(p3).project(camera); return { x: (tmp.x * 0.5 + 0.5) * W, y: (-tmp.y * 0.5 + 0.5) * H, vis: tmp.z < 1 && tmp.z > -1 }; }
const titleEl = document.getElementById('title'), chipEl = document.getElementById('chip');

window.renderAt = function (t) {
  const dist = camAt(t);

  const hU = ramp(t, 0.9, 0.5) * (1 - 0.55 * ramp(t, 2.1, 0.4)) + 0.3 * ramp(t, 8.0, 0.6);
  const hC = ramp(t, 2.05, 0.4) * (1 - 0.6 * ramp(t, 2.8, 0.5));
  const hZ = ramp(t, 5.85, 0.4) * (1 - 0.55 * ramp(t, 7.3, 0.5));
  dUch.set(Math.min(1, hU), easeOutBack((t - 0.9) / 0.7) * (1 - 0.7 * ramp(t, 2.1, 0.5)), dist);
  dChi.set(hC, easeOutBack((t - 2.05) / 0.6) * (1 - 0.7 * ramp(t, 2.8, 0.5)), dist);
  dZan.set(hZ, easeOutBack((t - 5.85) / 0.6) * (1 - 0.7 * ramp(t, 7.3, 0.5)), dist);
  HL.value.set(Math.min(1, hU) * 0.7, hC * 0.8, hZ);

  const ps = clamp(dist / 280, 1, 3.2);
  const labelScale = clamp(420 / dist, 0.5, 1.05);
  for (const [k, p] of Object.entries(pins)) {
    const a = t - PIN_T[k];
    const pop = easeOutBack(a / 0.55), grow = smooth(a / 0.5);
    p.g.visible = a > 0;
    if (a <= 0) { p.el.style.opacity = 0; continue; }
    p.g.scale.setScalar(ps);
    p.beam.scale.set(1, p.h * grow, 1);
    p.head.position.y = p.h * grow;
    p.head.scale.setScalar(Math.max(0.001, pop) * (p.big ? 1.5 : 1));
    [p.ring, p.ring2].forEach((r, j) => { const f = (a * 0.9 + j * 0.5) % 1; r.scale.setScalar(1 + f * 4); r.material.opacity = 0.85 * (1 - f) * grow; });
    p.disc.scale.setScalar(Math.max(0.001, pop));
    const sp = project(new THREE.Vector3(p.g.position.x, (p.h + 4) * ps, p.g.position.z));
    let sc = (p.big ? clamp(330 / dist, 0.6, 1.15) : labelScale) * pop;
    if (p.big) sc *= 1 + 0.12 * ramp(t, 8.1, 0.4);
    const far = p.big ? 1 : 1 - ramp(dist, 1200, 400);
    let op = sp.vis ? clamp(a / 0.25, 0, 1) * far : 0;
    if (!p.big && t > 8.1) op *= 1 - 0.7 * ramp(t, 8.2, 0.5);
    p.el.style.opacity = op;
    const hw = p.el.offsetWidth * sc / 2 + 36;
    p.el.style.transform = `translate(${clamp(sp.x, hw, W - hw)}px, ${Math.max(sp.y, 280)}px) translate(-50%, -100%) scale(${Math.max(0.001, sc)})`;
  }

  // landmark chips: visible when reasonably close
  const poiOp = 1 - ramp(dist, 1100, 500);
  pois.forEach(o => {
    const sp = project(v3(o.p, 0));
    const inside = sp.vis && sp.x > -50 && sp.x < W + 50 && sp.y > 250 && sp.y < H - 520;
    o.el.style.opacity = inside ? poiOp * ramp(t, 1.2, 0.5) : 0;
    o.el.style.transform = `translate(${sp.x - 20}px, ${sp.y - 20}px)`;
  });

  [['uchtepa', ramp(t, 0.95, 0.4) * (1 - ramp(t, 2.05, 0.3))],
   ['chilonzor', ramp(t, 2.1, 0.3) * (1 - ramp(t, 2.75, 0.3))],
   ['zangiota', ramp(t, 5.9, 0.35) * (1 - ramp(t, 7.25, 0.35))]].forEach(([k, o]) => {
    const el = dLabels[k], sp = project(v3(DL_AT[k], 0));
    const s = 0.8 + 0.2 * easeOutBack(o);
    el.style.opacity = o;
    const hw = el.offsetWidth * s / 2 + 40;
    el.style.transform = `translate(${clamp(sp.x, hw, W - hw)}px, ${clamp(sp.y - 160, 320, 1250)}px) translate(-50%, -50%) scale(${s})`;
  });

  arcs.forEach(a => {
    const k = smooth((t - 7.25 - a.delay) / 0.75);
    a.mesh.geometry.setDrawRange(0, Math.floor(a.seg * k) * a.rad * 6);
    a.mesh.scale.set(1, 1, 1);
    a.mesh.material.opacity = 0.85 * (1 - 0.8 * ramp(t, 8.3, 0.6));
    a.mesh.visible = k > 0;
  });

  titleEl.style.opacity = 1 - ramp(t, 0.75, 0.4);
  titleEl.style.transform = `translateY(${-30 * ramp(t, 0.75, 0.4)}px)`;
  chipEl.style.opacity = ramp(t, 0.9, 0.4);

  let ci = 0; for (let i = 0; i < CHUNK_T.length; i++) if (t >= CHUNK_T[i]) ci = i;
  if (capEl.dataset.ci !== String(ci)) { capEl.innerHTML = ''; capSpans[ci].forEach(s => capEl.appendChild(s)); capEl.dataset.ci = ci; }
  const [s0] = CHUNKS[ci];
  capSpans[ci].forEach((s, j) => s.classList.toggle('on', t >= WORDS[s0 + j][1]));

  renderer.render(scene, camera);
  return true;
};
window.ready = true;
</script>
</body>
</html>
